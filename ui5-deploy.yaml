# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: etudiant14.sap.training.helloworld
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4D_100
          url: http://s4d.virtual:443
          client: '100'
        app:
          name: ZUI5_BAS_14
          description: Étudiant 14
          package: ZTRAIN_14
          transport: S4DK900445
        exclude:
          - /test/
          - /localService/
